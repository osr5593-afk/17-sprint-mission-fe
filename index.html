<!doctype html>
<html lang="ko">
  <head>
    <meta charset="uft-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>판다마켓</title>
    <link
      rel="stylesheet"
      as="style"
      crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- 헤더 -->
    <header class="market-header">
      <div class="header-inner">
        <a href="index.html" class="market-logo">
          <img
            class="logo-img btn"
            src="images/panda_face.png"
            alt="판다마켓 로고"
          />
          <span>판다마켓</span>
        </a>
        <a class="login-btn" href="pages/login.html">로그인</a>
      </div>
    </header>

    <!-- 상단 히어로 섹션 -->
    <section class="hero">
      <div class="hero-inner">
        <div class="hero-text">
          <h1>
            일상의 모든 물건을<br />
            거래해 보세요
          </h1>
          <a class="hero-btn" href="pages/items.html">구경하러 가기</a>
        </div>
        <p>
          <img
            class="hero-img"
            src="images/Img_home_top.png"
            alt="탑 섹션 이미지"
          />
        </p>
      </div>
    </section>

    <!-- 가능 소개 섹션 (3개) -->
    <section class="features">
      <!-- 첫번쨰 소개 섹션 -->
      <div class="feature">
        <div class="feature-inner">
          <img
            class="feature-img"
            src="images/Img_home_01.png"
            alt="첫번쨰 메인 섹션 이미지"
          />
          <div class="feature-text">
            <span class="feature-name">Hot items</span>
            <h2>
              인기 상품을<br />
              확인해 보세요
            </h2>
            <p>가장 HOT한 중고거래 물품을<br />판다 마켓에서 확인해 보세요</p>
          </div>
        </div>
      </div>

      <!-- 두번째 소개 섹션 -->
      <div class="feture">
        <div class="feature-inner reverse">
          <img
            class="feature-img"
            src="images/Img_home_02.png"
            alt="두번째 메인 섹션 이미지"
          />
          <div class="feature-text">
            <span class="feature-name">Search</span>
            <h2>
              구매를 원하는<br />
              상품을 검색하세요
            </h2>
            <p>
              구매하고 싶은 물품은<br />
              검색해서 쉽게 찾아보세요
            </p>
          </div>
        </div>
      </div>

      <!-- section 3 -->
      <div class="feature">
        <div class="feature-inner">
          <img
            class="feature-img"
            src="images/Img_home_03.png"
            alt="세번째 메인 섹션 이미지"
          />
          <div class="feature-text">
            <span class="feature-name">Register</span>
            <h2 class="section-sudtitle">
              판매를 원하는<br />상품을 등록하세요
            </h2>
            <p class="section-description">
              어떤 물건이든 판매하고 싶은 상품을<br />쉽게 등록하세요
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- 하단 히어로 섹션 -->
    <section class="hero">
      <div class="hero-inner hero-bottom">
        <h2 class="bottom-name">믿을수 있는<br />판다마켓 중고 거래</h2>
        <img
          class="hero-img"
          src="images/Img_home_bottom.png"
          alt="바텀 히어로 이미지"
        />
      </div>
    </section>

    <!-- footer -->
    <footer class="footer">
      <div class="footer-inner">
        <p class="copyright">ⓒcodit-2024</p>
        <div class="footer-links">
          <a href="pages/privacy.html">Privacy Policy</a>
          <a href="pages/faq.html">FAQ</a>
        </div>
        <div class="social-links">
          <a href="https://www.facebook.com" target="_blank"
            ><img src="images/facebook_image.png" alt="페이스북 로고"
          /></a>
          <a href="https://x.com" target="_blank"
            ><img src="images/twitter_image.png" alt="트위터 로고"
          /></a>
          <a href="https://www.youtube.com" target="_blank"
            ><img src="images/youtube_image.png" alt="유튜브 로고"
          /></a>
          <a href="https://www.instagram.com" target="_blank"
            ><img src="images/instagram_image.png" alt="인스타글램 로고"
          /></a>
        </div>
      </div>
    </footer>
  </body>
</html>
